<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="tasteBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b1e"/>
      <stop offset="0.46" stop-color="#0f3132"/>
      <stop offset="1" stop-color="#eaf5ef"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f6fbf8" stop-opacity="0.93"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13383a"/>
      <stop offset="1" stop-color="#071f23"/>
    </linearGradient>
    <linearGradient id="tealTaste" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29d2bd"/>
      <stop offset="1" stop-color="#07847b"/>
    </linearGradient>
    <linearGradient id="warmTaste" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d590"/>
      <stop offset="1" stop-color="#b97722"/>
    </linearGradient>
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#031316" flood-opacity="0.32"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#031316" flood-opacity="0.14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="screenClip">
      <rect x="70" y="70" width="1460" height="960" rx="34"/>
    </clipPath>
    <style>
      .ui { font-family: "Cabinet Grotesk", "Geist", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; letter-spacing: 0; }
      .hero { font-size: 70px; line-height: 0.95; font-weight: 850; fill: #ffffff; }
      .heroDark { font-size: 46px; line-height: 1; font-weight: 830; fill: #071c20; }
      .h2 { font-size: 28px; font-weight: 820; fill: #071c20; }
      .h3 { font-size: 20px; font-weight: 780; fill: #0a2427; }
      .small { font-size: 14px; font-weight: 620; fill: #627476; }
      .tiny { font-size: 12px; font-weight: 660; fill: #7b8a8b; }
      .whiteSmall { font-size: 15px; font-weight: 620; fill: #c8e6e1; }
      .whiteTitle { font-size: 22px; font-weight: 800; fill: #ffffff; }
      .money { font-size: 35px; font-weight: 850; fill: #071c20; }
      .moneyLight { font-size: 40px; font-weight: 850; fill: #ffffff; }
      .navText { font-size: 15px; font-weight: 720; fill: #d6ebe7; }
      .buttonText { font-size: 20px; font-weight: 820; fill: #ffffff; }
      .inputText { font-size: 20px; font-weight: 680; fill: #0b2528; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#tasteBg)"/>
  <rect width="1600" height="1100" filter="url(#grain)" opacity="0.45"/>
  <circle cx="1310" cy="150" r="330" fill="#2ee0c7" opacity="0.18"/>
  <circle cx="220" cy="980" r="360" fill="#f6c56b" opacity="0.16"/>

  <g class="ui" clip-path="url(#screenClip)">
    <rect x="70" y="70" width="1460" height="960" rx="34" fill="#f7fbf8" filter="url(#bigShadow)"/>

    <!-- top navigation -->
    <rect x="112" y="104" width="1376" height="76" rx="38" fill="#082326" opacity="0.94"/>
    <rect x="132" y="121" width="44" height="44" rx="14" fill="url(#tealTaste)"/>
    <text x="154" y="150" text-anchor="middle" font-size="22" font-weight="850" fill="#fff">¥</text>
    <text x="194" y="149" class="whiteTitle">每日记账</text>
    <text x="918" y="149" class="navText">总览</text>
    <text x="996" y="149" class="navText">预算</text>
    <text x="1074" y="149" class="navText">流水</text>
    <text x="1152" y="149" class="navText">导入</text>
    <rect x="1290" y="116" width="172" height="52" rx="26" fill="#ffffff"/>
    <text x="1376" y="149" text-anchor="middle" font-size="16" font-weight="820" fill="#082326">快速记一笔</text>

    <!-- attention / hero -->
    <rect x="112" y="212" width="594" height="292" rx="30" fill="url(#cardDark)" filter="url(#cardShadow)"/>
    <text x="152" y="291" class="hero">把日常</text>
    <text x="152" y="361" class="hero">花销看清楚</text>
    <text x="154" y="414" class="whiteSmall">本地保存、按预算追踪、当天快速记账。</text>
    <rect x="154" y="444" width="176" height="48" rx="24" fill="url(#tealTaste)"/>
    <text x="242" y="475" text-anchor="middle" class="buttonText">保存支出</text>
    <rect x="344" y="444" width="150" height="48" rx="24" fill="none" stroke="#bfe8e1"/>
    <text x="419" y="475" text-anchor="middle" font-size="18" font-weight="780" fill="#e9fffb">查看流水</text>
    <rect x="532" y="250" width="134" height="204" rx="26" fill="#ffffff" opacity="0.12"/>
    <path d="M558 385c28-70 54-32 80-110" fill="none" stroke="#29d2bd" stroke-width="8" stroke-linecap="round"/>

    <!-- hero companion bento -->
    <rect x="734" y="212" width="352" height="136" rx="26" fill="url(#glass)" stroke="#dce9e5" filter="url(#cardShadow)"/>
    <text x="766" y="259" class="small">本月已支出</text>
    <text x="766" y="310" class="money">¥1,284.60</text>
    <rect x="1000" y="242" width="54" height="54" rx="18" fill="#e4f8f3"/>
    <path d="M1014 269h26M1027 256v26" stroke="#07847b" stroke-width="5" stroke-linecap="round"/>

    <rect x="1114" y="212" width="374" height="136" rx="26" fill="#fff8eb" stroke="#f0d8a6" filter="url(#cardShadow)"/>
    <text x="1146" y="259" class="small">购物预算进度</text>
    <text x="1146" y="310" font-size="34" font-weight="850" fill="#935c17">71%</text>
    <rect x="1256" y="286" width="180" height="12" rx="6" fill="#ead9b9"/>
    <rect x="1256" y="286" width="128" height="12" rx="6" fill="url(#warmTaste)"/>

    <rect x="734" y="376" width="754" height="128" rx="26" fill="#ffffff" stroke="#dce9e5" filter="url(#cardShadow)"/>
    <text x="766" y="429" class="heroDark">今天适合先记一笔</text>
    <text x="766" y="466" class="small">金额、日期、分类、备注保持一屏完成，减少来回切换。</text>
    <g transform="translate(1278 410)">
      <circle cx="0" cy="24" r="24" fill="#e4f8f3"/>
      <circle cx="38" cy="24" r="24" fill="#e8eefc"/>
      <circle cx="76" cy="24" r="24" fill="#fff1d3"/>
      <text x="0" y="31" text-anchor="middle" font-size="16" font-weight="840" fill="#07847b">餐</text>
      <text x="38" y="31" text-anchor="middle" font-size="16" font-weight="840" fill="#2f67df">交</text>
      <text x="76" y="31" text-anchor="middle" font-size="16" font-weight="840" fill="#b7791f">购</text>
    </g>

    <!-- dense bento body -->
    <rect x="112" y="536" width="384" height="404" rx="30" fill="#ffffff" stroke="#dce9e5" filter="url(#cardShadow)"/>
    <text x="146" y="590" class="h2">快速记账</text>
    <text x="438" y="590" text-anchor="end" font-size="16" font-weight="820" fill="#07847b">完整表单</text>
    <text x="146" y="636" class="tiny">金额</text>
    <rect x="146" y="650" width="142" height="58" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="165" y="688" class="inputText" fill="#7b8587">0.00</text>
    <text x="312" y="636" class="tiny">日期</text>
    <rect x="312" y="650" width="150" height="58" rx="16" fill="#fbfdfd" stroke="#0b938b" stroke-width="2"/>
    <text x="328" y="688" font-size="17" font-weight="760" fill="#0b2528">06/11</text>
    <rect x="424" y="669" width="22" height="22" rx="4" fill="none" stroke="#0b2528" stroke-width="2.4"/>
    <text x="146" y="748" class="tiny">一级分类</text>
    <rect x="146" y="762" width="142" height="58" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="165" y="800" class="inputText">餐饮</text>
    <text x="312" y="748" class="tiny">二级分类</text>
    <rect x="312" y="762" width="150" height="58" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="331" y="800" class="inputText">外卖</text>
    <text x="146" y="860" class="tiny">备注</text>
    <rect x="146" y="874" width="316" height="58" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="165" y="912" class="inputText" fill="#7b8587">可选备注</text>
    <rect x="146" y="956" width="316" height="62" rx="18" fill="url(#tealTaste)"/>
    <text x="304" y="995" text-anchor="middle" class="buttonText">保存支出</text>

    <rect x="526" y="536" width="582" height="404" rx="30" fill="#ffffff" stroke="#dce9e5" filter="url(#cardShadow)"/>
    <text x="560" y="590" class="h2">预算状态</text>
    <text x="1058" y="590" text-anchor="end" class="small">每月</text>
    <g transform="translate(560 624)">
      <rect x="0" y="0" width="514" height="68" rx="18" fill="#f8fbfa"/>
      <circle cx="30" cy="34" r="20" fill="#e4f8f3"/>
      <text x="30" y="41" text-anchor="middle" font-size="16" font-weight="840" fill="#07847b">餐</text>
      <text x="66" y="29" class="h3">餐饮</text>
      <text x="66" y="51" class="tiny">¥586 / ¥1,200</text>
      <rect x="292" y="30" width="150" height="10" rx="5" fill="#e4ece9"/>
      <rect x="292" y="30" width="74" height="10" rx="5" fill="#07847b"/>
      <text x="488" y="39" text-anchor="end" font-size="15" font-weight="820" fill="#0b2528">49%</text>

      <rect x="0" y="86" width="514" height="68" rx="18" fill="#fff8eb"/>
      <circle cx="30" cy="120" r="20" fill="#fff1d3"/>
      <text x="30" y="127" text-anchor="middle" font-size="16" font-weight="840" fill="#b7791f">购</text>
      <text x="66" y="115" class="h3">购物</text>
      <text x="66" y="137" class="tiny">¥428.60 / ¥600</text>
      <rect x="292" y="116" width="150" height="10" rx="5" fill="#ead9b9"/>
      <rect x="292" y="116" width="107" height="10" rx="5" fill="#b7791f"/>
      <text x="488" y="125" text-anchor="end" font-size="15" font-weight="820" fill="#0b2528">71%</text>

      <rect x="0" y="172" width="514" height="68" rx="18" fill="#f8fbfa"/>
      <circle cx="30" cy="206" r="20" fill="#e8eefc"/>
      <text x="30" y="213" text-anchor="middle" font-size="16" font-weight="840" fill="#2f67df">交</text>
      <text x="66" y="201" class="h3">交通</text>
      <text x="66" y="223" class="tiny">¥126 / ¥500</text>
      <rect x="292" y="202" width="150" height="10" rx="5" fill="#e1e8f7"/>
      <rect x="292" y="202" width="38" height="10" rx="5" fill="#2f67df"/>
      <text x="488" y="211" text-anchor="end" font-size="15" font-weight="820" fill="#0b2528">25%</text>

      <rect x="0" y="258" width="514" height="68" rx="18" fill="#fff"/>
      <text x="24" y="301" class="small">堆叠卡片滚动预览：预算行在滚动中依次贴合，保持视觉焦点。</text>
    </g>

    <rect x="1138" y="536" width="350" height="404" rx="30" fill="url(#cardDark)" filter="url(#cardShadow)"/>
    <text x="1172" y="590" class="whiteTitle">提醒与节奏</text>
    <text x="1172" y="622" class="whiteSmall">固定标题 + 右侧滚动卡片</text>
    <rect x="1172" y="660" width="282" height="74" rx="20" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1198" y="693" class="whiteTitle" font-size="18">购物接近提醒</text>
    <text x="1198" y="716" class="whiteSmall">已使用预算 71%</text>
    <rect x="1172" y="752" width="282" height="74" rx="20" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1198" y="785" class="whiteTitle" font-size="18">连续记账 5 天</text>
    <text x="1198" y="808" class="whiteSmall">今天已默认填好日期</text>
    <rect x="1172" y="844" width="282" height="74" rx="20" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1198" y="877" class="whiteTitle" font-size="18">餐饮预算健康</text>
    <text x="1198" y="900" class="whiteSmall">本月仍有 ¥614.00</text>

    <!-- footer/action strip -->
    <rect x="112" y="968" width="1376" height="62" rx="28" fill="#082326"/>
    <text x="148" y="1007" font-size="18" font-weight="780" fill="#e9fffb">导出备份、分类预算、流水搜索都保留在同一套安静的工具界面里。</text>
    <text x="1446" y="1007" text-anchor="end" font-size="18" font-weight="820" fill="#29d2bd">打开完整表单</text>
  </g>
</svg>
