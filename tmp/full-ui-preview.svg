<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfb"/>
      <stop offset="0.5" stop-color="#eef7f4"/>
      <stop offset="1" stop-color="#f7f2ea"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b7aa"/>
      <stop offset="1" stop-color="#077d77"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7df3"/>
      <stop offset="1" stop-color="#255ed6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfefd"/>
    </linearGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#132c2e" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#132c2e" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: Inter, "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; letter-spacing: 0; }
      .h1 { font-size: 36px; font-weight: 800; fill: #081f23; }
      .h2 { font-size: 23px; font-weight: 760; fill: #081f23; }
      .h3 { font-size: 17px; font-weight: 720; fill: #0b2327; }
      .body { font-size: 15px; font-weight: 520; fill: #607174; }
      .small { font-size: 13px; font-weight: 560; fill: #718184; }
      .nav { font-size: 15px; font-weight: 680; fill: #405154; }
      .navActive { font-size: 15px; font-weight: 760; fill: #063d3b; }
      .metricLabel { font-size: 14px; font-weight: 650; fill: #68797c; }
      .metricValue { font-size: 31px; font-weight: 790; fill: #07191c; }
      .money { font-size: 18px; font-weight: 750; fill: #081f23; }
      .mutedMoney { font-size: 16px; font-weight: 700; fill: #667579; }
      .inputText { font-size: 20px; font-weight: 620; fill: #08191d; }
      .buttonText { font-size: 21px; font-weight: 790; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="url(#bg)"/>
  <circle cx="1258" cy="120" r="190" fill="#ddf1ef" opacity="0.75"/>
  <circle cx="230" cy="905" r="250" fill="#e6edfc" opacity="0.75"/>

  <g class="ui">
    <rect x="28" y="28" width="1384" height="924" rx="24" fill="#f7fbfb" stroke="#dce8e6"/>

    <!-- Sidebar -->
    <rect x="48" y="48" width="250" height="884" rx="18" fill="#ffffff" stroke="#dce7e5" filter="url(#softShadow)"/>
    <g transform="translate(78 82)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#teal)"/>
      <text x="24" y="33" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">¥</text>
      <text x="64" y="20" class="h3">每日记账</text>
      <text x="64" y="43" class="small">本地支出流水</text>
    </g>

    <g transform="translate(70 174)">
      <rect x="0" y="0" width="206" height="46" rx="12" fill="#e5f6f3"/>
      <rect x="0" y="0" width="4" height="46" rx="2" fill="#0b9b92"/>
      <text x="44" y="29" class="navActive">总览</text>
      <circle cx="22" cy="23" r="7" fill="#0b9b92"/>

      <text x="44" y="93" class="nav">记一笔</text>
      <circle cx="22" cy="88" r="7" fill="#b7c4c5"/>
      <text x="44" y="157" class="nav">分类与预算</text>
      <circle cx="22" cy="152" r="7" fill="#b7c4c5"/>
      <text x="44" y="221" class="nav">流水明细</text>
      <circle cx="22" cy="216" r="7" fill="#b7c4c5"/>
      <text x="44" y="285" class="nav">导入导出</text>
      <circle cx="22" cy="280" r="7" fill="#b7c4c5"/>
    </g>

    <g transform="translate(78 840)">
      <text class="small" x="0" y="0">数据保存在本机</text>
      <text font-size="19" font-weight="780" fill="#081f23" x="0" y="32">24 条流水</text>
    </g>

    <!-- Main content -->
    <g transform="translate(330 72)">
      <text class="h1" x="0" y="36">总览</text>
      <text class="body" x="0" y="66">每月：2026-06-01 至 2026-06-30</text>

      <g transform="translate(614 0)">
        <rect x="0" y="0" width="258" height="44" rx="12" fill="#ffffff" stroke="#d7e4e2"/>
        <rect x="6" y="6" width="78" height="32" rx="9" fill="#0b9b92"/>
        <text x="45" y="27" text-anchor="middle" font-size="14" font-weight="760" fill="#fff">每周</text>
        <text x="130" y="27" text-anchor="middle" font-size="14" font-weight="680" fill="#536568">每月</text>
        <text x="214" y="27" text-anchor="middle" font-size="14" font-weight="680" fill="#536568">每年</text>
      </g>

      <!-- Metrics -->
      <g transform="translate(0 105)">
        <rect x="0" y="0" width="278" height="126" rx="16" fill="url(#paper)" stroke="#dce7e5" filter="url(#cardShadow)"/>
        <rect x="0" y="0" width="4" height="126" rx="2" fill="#2f68df"/>
        <text class="metricLabel" x="24" y="34">已支出</text>
        <text class="metricValue" x="24" y="79">¥1,284.60</text>
        <text class="small" x="24" y="105">本周期已记录支出</text>
        <circle cx="226" cy="42" r="24" fill="#e6edfc"/>
        <path d="M215 45h22M226 34v22" stroke="#2f68df" stroke-width="4" stroke-linecap="round"/>

        <rect x="306" y="0" width="278" height="126" rx="16" fill="url(#paper)" stroke="#dce7e5" filter="url(#cardShadow)"/>
        <rect x="306" y="0" width="4" height="126" rx="2" fill="#0b9b92"/>
        <text class="metricLabel" x="330" y="34">剩余</text>
        <text class="metricValue" x="330" y="79">¥2,715.40</text>
        <text class="small" x="330" y="105">可用预算</text>
        <circle cx="532" cy="42" r="24" fill="#e5f6f3"/>
        <path d="M520 45l8 8 18-22" stroke="#0b9b92" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="612" y="0" width="278" height="126" rx="16" fill="url(#paper)" stroke="#dce7e5" filter="url(#cardShadow)"/>
        <rect x="612" y="0" width="4" height="126" rx="2" fill="#7c5fd6"/>
        <text class="metricLabel" x="636" y="34">预算</text>
        <text class="metricValue" x="636" y="79">¥4,000.00</text>
        <text class="small" x="636" y="105">5 条启用规则</text>
        <circle cx="838" cy="42" r="24" fill="#eeeafd"/>
        <path d="M828 33h20v20h-20z" fill="none" stroke="#7c5fd6" stroke-width="3"/>
      </g>

      <!-- Budget panel -->
      <g transform="translate(0 262)">
        <rect x="0" y="0" width="890" height="338" rx="18" fill="#ffffff" stroke="#dce7e5" filter="url(#cardShadow)"/>
        <text class="h2" x="26" y="42">预算状态</text>
        <text class="small" x="818" y="42" text-anchor="end">每月</text>
        <line x1="26" y1="64" x2="864" y2="64" stroke="#edf3f2"/>

        <g transform="translate(26 88)">
          <text class="small" x="0" y="0">分类</text>
          <text class="small" x="265" y="0">已支出</text>
          <text class="small" x="405" y="0">预算</text>
          <text class="small" x="545" y="0">剩余</text>
          <text class="small" x="700" y="0">进度</text>
