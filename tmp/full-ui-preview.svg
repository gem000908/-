        <g transform="translate(26 116)">
          <rect x="0" y="0" width="838" height="56" rx="12" fill="#fbfdfd"/>
          <circle cx="23" cy="28" r="14" fill="#e5f6f3"/>
          <text class="h3" x="48" y="34">餐饮</text>
          <text class="mutedMoney" x="265" y="34">¥586.00</text>
          <text class="mutedMoney" x="405" y="34">¥1,200.00</text>
          <text class="mutedMoney" x="545" y="34">¥614.00</text>
          <rect x="700" y="22" width="108" height="10" rx="5" fill="#e7eeee"/>
          <rect x="700" y="22" width="53" height="10" rx="5" fill="#0b9b92"/>
          <text class="small" x="824" y="34" text-anchor="end">49%</text>

          <rect x="0" y="68" width="838" height="56" rx="12" fill="#ffffff"/>
          <circle cx="23" cy="96" r="14" fill="#e6edfc"/>
          <text class="h3" x="48" y="102">交通</text>
          <text class="mutedMoney" x="265" y="102">¥126.00</text>
          <text class="mutedMoney" x="405" y="102">¥500.00</text>
          <text class="mutedMoney" x="545" y="102">¥374.00</text>
          <rect x="700" y="90" width="108" height="10" rx="5" fill="#e7eeee"/>
          <rect x="700" y="90" width="27" height="10" rx="5" fill="#2f68df"/>
          <text class="small" x="824" y="102" text-anchor="end">25%</text>

          <rect x="0" y="136" width="838" height="56" rx="12" fill="#fbfdfd"/>
          <circle cx="23" cy="164" r="14" fill="#fff3d5"/>
          <text class="h3" x="48" y="170">购物</text>
          <text class="mutedMoney" x="265" y="170">¥428.60</text>
          <text class="mutedMoney" x="405" y="170">¥600.00</text>
          <text class="mutedMoney" x="545" y="170">¥171.40</text>
          <rect x="700" y="158" width="108" height="10" rx="5" fill="#e7eeee"/>
          <rect x="700" y="158" width="77" height="10" rx="5" fill="#c98716"/>
          <text class="small" x="824" y="170" text-anchor="end">71%</text>

          <rect x="0" y="204" width="838" height="56" rx="12" fill="#ffffff"/>
          <circle cx="23" cy="232" r="14" fill="#fdecef"/>
          <text class="h3" x="48" y="238">娱乐</text>
          <text class="mutedMoney" x="265" y="238">¥144.00</text>
          <text class="mutedMoney" x="405" y="238">¥300.00</text>
          <text class="mutedMoney" x="545" y="238">¥156.00</text>
          <rect x="700" y="226" width="108" height="10" rx="5" fill="#e7eeee"/>
          <rect x="700" y="226" width="52" height="10" rx="5" fill="#c83e4d"/>
          <text class="small" x="824" y="238" text-anchor="end">48%</text>
        </g>
      </g>

      <!-- Recent list -->
      <g transform="translate(0 632)">
        <rect x="0" y="0" width="890" height="250" rx="18" fill="#ffffff" stroke="#dce7e5" filter="url(#cardShadow)"/>
        <text class="h2" x="26" y="42">最近流水</text>
        <text font-size="15" font-weight="720" fill="#0b9188" x="840" y="42" text-anchor="end">查看全部</text>
        <line x1="26" y1="64" x2="864" y2="64" stroke="#edf3f2"/>

        <g transform="translate(26 88)">
          <circle cx="24" cy="24" r="20" fill="#e5f6f3"/>
          <text x="24" y="31" text-anchor="middle" font-size="18" font-weight="760" fill="#0b9188">餐</text>
          <text class="h3" x="60" y="20">餐饮 / 外卖</text>
          <text class="small" x="60" y="44">工作日晚餐</text>
          <text class="money" x="812" y="20" text-anchor="end">¥36.00</text>
          <text class="small" x="812" y="44" text-anchor="end">2026-06-10</text>

          <line x1="0" y1="68" x2="838" y2="68" stroke="#edf3f2"/>
          <circle cx="24" cy="100" r="20" fill="#e6edfc"/>
          <text x="24" y="107" text-anchor="middle" font-size="18" font-weight="760" fill="#2f68df">交</text>
          <text class="h3" x="60" y="96">交通 / 打车</text>
          <text class="small" x="60" y="120">雨天通勤</text>
          <text class="money" x="812" y="96" text-anchor="end">¥24.00</text>
          <text class="small" x="812" y="120" text-anchor="end">2026-06-09</text>

          <line x1="0" y1="144" x2="838" y2="144" stroke="#edf3f2"/>
          <circle cx="24" cy="176" r="20" fill="#fff3d5"/>
          <text x="24" y="183" text-anchor="middle" font-size="18" font-weight="760" fill="#c98716">购</text>
          <text class="h3" x="60" y="172">购物 / 日用品</text>
          <text class="small" x="60" y="196">洗护补货</text>
          <text class="money" x="812" y="172" text-anchor="end">¥89.90</text>
          <text class="small" x="812" y="196" text-anchor="end">2026-06-08</text>
        </g>
      </g>
    </g>

    <!-- Right rail -->
    <g transform="translate(1242 72)">
      <rect x="-260" y="0" width="360" height="440" rx="18" fill="#ffffff" stroke="#dce7e5" filter="url(#cardShadow)"/>
      <rect x="-260" y="0" width="360" height="6" rx="3" fill="url(#teal)"/>
      <text class="h2" x="-232" y="48">快速记账</text>
      <text font-size="16" font-weight="760" fill="#0b9188" x="72" y="48" text-anchor="end">完整表单</text>

      <g transform="translate(-232 76)">
        <text class="small" x="0" y="0">金额</text>
        <rect x="0" y="12" width="144" height="54" rx="11" fill="#fff" stroke="#d6e2e2"/>
        <text class="inputText" x="16" y="47" fill="#6b7478">0.00</text>

        <text class="small" x="172" y="0">日期</text>
        <rect x="172" y="12" width="132" height="54" rx="11" fill="#fff" stroke="#10a398" stroke-width="2"/>
        <text font-size="17" font-weight="650" fill="#08191d" x="184" y="47">06/10</text>
        <rect x="260" y="28" width="22" height="22" rx="4" fill="none" stroke="#0a2023" stroke-width="2.3"/>
        <path d="M266 28v6M276 28v6M261 38h20" stroke="#0a2023" stroke-width="2.3" stroke-linecap="round"/>

        <text class="small" x="0" y="98">一级分类</text>
        <rect x="0" y="110" width="144" height="54" rx="11" fill="#fff" stroke="#d6e2e2"/>
        <text class="inputText" x="16" y="145">餐饮</text>
        <path d="M116 132l8 8 8-8" fill="none" stroke="#08191d" stroke-width="3" stroke-linecap="round"/>

        <text class="small" x="172" y="98">二级分类</text>
        <rect x="172" y="110" width="132" height="54" rx="11" fill="#fff" stroke="#d6e2e2"/>
        <text class="inputText" x="188" y="145">外卖</text>
        <path d="M272 132l8 8 8-8" fill="none" stroke="#08191d" stroke-width="3" stroke-linecap="round"/>

        <text class="small" x="0" y="196">备注</text>
        <rect x="0" y="208" width="304" height="54" rx="11" fill="#fff" stroke="#d6e2e2"/>
        <text class="inputText" x="16" y="243" fill="#778286">可选备注</text>

        <rect x="0" y="292" width="304" height="58" rx="13" fill="url(#teal)" filter="url(#softShadow)"/>
        <text class="buttonText" x="152" y="329" text-anchor="middle">保存支出</text>
      </g>

      <g transform="translate(-260 472)">
        <rect x="0" y="0" width="360" height="276" rx="18" fill="#ffffff" stroke="#dce7e5" filter="url(#cardShadow)"/>
        <text class="h2" x="28" y="44">提醒</text>
        <g transform="translate(28 74)">
          <rect x="0" y="0" width="304" height="58" rx="13" fill="#f7fbfb" stroke="#dde9e7"/>
          <circle cx="26" cy="29" r="13" fill="#e5f6f3"/>
          <path d="M20 30l5 5 10-13" stroke="#0b9b92" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text class="h3" x="52" y="25">餐饮预算健康</text>
          <text class="small" x="52" y="46">本月仍有 ¥614.00</text>

          <rect x="0" y="76" width="304" height="58" rx="13" fill="#fff9eb" stroke="#f0d7a4"/>
          <circle cx="26" cy="105" r="13" fill="#fff3d5"/>
          <text x="26" y="111" text-anchor="middle" font-size="17" font-weight="800" fill="#c98716">!</text>
          <text class="h3" x="52" y="101">购物接近提醒</text>
          <text class="small" x="52" y="122">已使用预算 71%</text>

          <rect x="0" y="152" width="304" height="58" rx="13" fill="#f7fbfb" stroke="#dde9e7"/>
          <circle cx="26" cy="181" r="13" fill="#e6edfc"/>
          <path d="M18 181h16M26 173v16" stroke="#2f68df" stroke-width="3" stroke-linecap="round"/>
          <text class="h3" x="52" y="177">连续记账 4 天</text>
          <text class="small" x="52" y="198">今日已准备好</text>
        </g>
      </g>
    </g>
  </g>
</svg>
