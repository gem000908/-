<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06191d"/>
      <stop offset="0.42" stop-color="#102f31"/>
      <stop offset="1" stop-color="#f3f8f4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fcfa"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a3c"/>
      <stop offset="1" stop-color="#071f22"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd8c2"/>
      <stop offset="1" stop-color="#07847b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd991"/>
      <stop offset="1" stop-color="#b97722"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#031316" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#031316" flood-opacity="0.12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="clip"><rect x="70" y="70" width="1460" height="960" rx="34"/></clipPath>
    <style>
      .ui { font-family: "Cabinet Grotesk", "Geist", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; letter-spacing: 0; }
      .nav { font-size: 15px; font-weight: 720; fill: #d7ece8; }
      .hero { font-size: 66px; line-height: 0.96; font-weight: 850; fill: #ffffff; }
      .heroSub { font-size: 17px; font-weight: 620; fill: #c8e5df; }
      .h2 { font-size: 29px; font-weight: 850; fill: #071c20; }
      .h2Light { font-size: 29px; font-weight: 850; fill: #ffffff; }
      .h3 { font-size: 20px; font-weight: 800; fill: #0a2427; }
      .small { font-size: 14px; font-weight: 630; fill: #657779; }
      .tiny { font-size: 12px; font-weight: 700; fill: #7f8d8e; }
      .lightSmall { font-size: 14px; font-weight: 630; fill: #c8e5df; }
      .money { font-size: 38px; font-weight: 870; fill: #071c20; }
      .moneyLight { font-size: 42px; font-weight: 870; fill: #ffffff; }
      .input { font-size: 20px; font-weight: 700; fill: #0a2427; }
      .button { font-size: 20px; font-weight: 840; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" filter="url(#grain)" opacity="0.5"/>
  <circle cx="1260" cy="140" r="320" fill="#2bd8c2" opacity="0.16"/>
  <circle cx="210" cy="990" r="340" fill="#ffd991" opacity="0.14"/>

  <g class="ui" clip-path="url(#clip)">
    <rect x="70" y="70" width="1460" height="960" rx="34" fill="#f8fbf8" filter="url(#shadow)"/>

    <rect x="112" y="104" width="1376" height="74" rx="37" fill="#082326"/>
    <rect x="132" y="120" width="42" height="42" rx="14" fill="url(#teal)"/>
    <text x="153" y="148" text-anchor="middle" font-size="22" font-weight="850" fill="#fff">¥</text>
    <text x="194" y="148" font-size="22" font-weight="850" fill="#fff">每日记账</text>
    <text x="908" y="148" class="nav">总览</text>
    <text x="988" y="148" class="nav">预算</text>
    <text x="1068" y="148" class="nav">流水</text>
    <text x="1148" y="148" class="nav">分类</text>
    <rect x="1300" y="118" width="154" height="46" rx="23" fill="#ffffff"/>
    <text x="1377" y="147" text-anchor="middle" font-size="16" font-weight="830" fill="#082326">导出备份</text>

    <!-- Attention: overview only, no duplicate quick-add CTA -->
    <rect x="112" y="212" width="640" height="284" rx="30" fill="url(#darkPanel)" filter="url(#soft)"/>
    <text x="154" y="291" class="hero">一眼看懂</text>
    <text x="154" y="357" class="hero">这个月的钱</text>
    <text x="156" y="410" class="heroSub">总览只负责回答：花了多少、还剩多少、哪里快超预算。</text>
    <rect x="156" y="444" width="214" height="12" rx="6" fill="#ffffff" opacity="0.15"/>
    <rect x="156" y="444" width="128" height="12" rx="6" fill="url(#teal)"/>
    <text x="392" y="456" class="heroSub">预算使用 32%</text>

    <rect x="782" y="212" width="338" height="132" rx="26" fill="url(#panel)" stroke="#dce9e5" filter="url(#soft)"/>
    <text x="814" y="258" class="small">本月已支出</text>
    <text x="814" y="308" class="money">¥1,284.60</text>
    <circle cx="1056" cy="278" r="30" fill="#e4f8f3"/>
    <path d="M1042 281h28M1056 267v28" stroke="#07847b" stroke-width="5" stroke-linecap="round"/>

    <rect x="1150" y="212" width="338" height="132" rx="26" fill="url(#panel)" stroke="#dce9e5" filter="url(#soft)"/>
    <text x="1182" y="258" class="small">本月剩余</text>
    <text x="1182" y="308" class="money">¥2,715.40</text>
    <circle cx="1424" cy="278" r="30" fill="#e8eefc"/>
    <path d="M1410 279l10 10 20-25" fill="none" stroke="#2f67df" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="782" y="374" width="706" height="122" rx="26" fill="#fff8eb" stroke="#f0d8a6" filter="url(#soft)"/>
    <text x="814" y="426" class="h2">购物预算接近提醒</text>
    <text x="814" y="463" class="small">这个区域只显示需要注意的洞察，不再重复完整预算表。</text>
    <rect x="1264" y="430" width="174" height="12" rx="6" fill="#ead9b9"/>
    <rect x="1264" y="430" width="124" height="12" rx="6" fill="url(#amber)"/>
    <text x="1440" y="407" text-anchor="end" font-size="34" font-weight="870" fill="#935c17">71%</text>

    <!-- Dense bento: each card has unique job -->
    <rect x="112" y="530" width="356" height="408" rx="30" fill="url(#panel)" stroke="#dce9e5" filter="url(#soft)"/>
    <text x="146" y="584" class="h2">快速记账</text>
    <text x="146" y="616" class="small">唯一的录入入口，避免到处出现保存按钮。</text>
    <text x="146" y="660" class="tiny">金额</text>
    <rect x="146" y="674" width="286" height="56" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="166" y="710" class="input" fill="#7c8889">0.00</text>
    <text x="146" y="764" class="tiny">日期</text>
    <rect x="146" y="778" width="286" height="56" rx="16" fill="#fbfdfd" stroke="#0b938b" stroke-width="2"/>
    <text x="166" y="814" class="input">2026/06/11</text>
    <rect x="388" y="796" width="24" height="24" rx="5" fill="none" stroke="#0a2427" stroke-width="2.5"/>
    <text x="146" y="868" class="tiny">分类与备注</text>
    <rect x="146" y="882" width="136" height="56" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="166" y="918" class="input">餐饮</text>
    <rect x="296" y="882" width="136" height="56" rx="16" fill="#fbfdfd" stroke="#d7e4e1"/>
    <text x="316" y="918" class="input">外卖</text>
    <rect x="146" y="968" width="286" height="60" rx="18" fill="url(#teal)"/>
    <text x="289" y="1006" text-anchor="middle" class="button">保存支出</text>

    <rect x="498" y="530" width="520" height="408" rx="30" fill="url(#panel)" stroke="#dce9e5" filter="url(#soft)"/>
    <text x="532" y="584" class="h2">预算健康</text>
    <text x="532" y="616" class="small">负责展示完整预算状态，与提醒区分离。</text>
    <g transform="translate(532 654)">
      <rect x="0" y="0" width="452" height="66" rx="18" fill="#f8fbfa"/>
      <circle cx="30" cy="33" r="20" fill="#e4f8f3"/>
      <text x="30" y="40" text-anchor="middle" font-size="16" font-weight="840" fill="#07847b">餐</text>
      <text x="66" y="29" class="h3">餐饮</text>
      <text x="66" y="51" class="tiny">剩余 ¥614.00</text>
      <rect x="258" y="29" width="118" height="10" rx="5" fill="#e4ece9"/>
      <rect x="258" y="29" width="58" height="10" rx="5" fill="#07847b"/>
      <text x="426" y="38" text-anchor="end" font-size="15" font-weight="820" fill="#0b2528">49%</text>

      <rect x="0" y="84" width="452" height="66" rx="18" fill="#fff8eb"/>
      <circle cx="30" cy="117" r="20" fill="#fff1d3"/>
      <text x="30" y="124" text-anchor="middle" font-size="16" font-weight="840" fill="#b7791f">购</text>
      <text x="66" y="113" class="h3">购物</text>
      <text x="66" y="135" class="tiny">剩余 ¥171.40</text>
      <rect x="258" y="113" width="118" height="10" rx="5" fill="#ead9b9"/>
      <rect x="258" y="113" width="84" height="10" rx="5" fill="#b7791f"/>
      <text x="426" y="122" text-anchor="end" font-size="15" font-weight="820" fill="#0b2528">71%</text>

      <rect x="0" y="168" width="452" height="66" rx="18" fill="#f8fbfa"/>
      <circle cx="30" cy="201" r="20" fill="#e8eefc"/>
      <text x="30" y="208" text-anchor="middle" font-size="16" font-weight="840" fill="#2f67df">交</text>
      <text x="66" y="197" class="h3">交通</text>
      <text x="66" y="219" class="tiny">剩余 ¥374.00</text>
      <rect x="258" y="197" width="118" height="10" rx="5" fill="#e1e8f7"/>
      <rect x="258" y="197" width="30" height="10" rx="5" fill="#2f67df"/>
      <text x="426" y="206" text-anchor="end" font-size="15" font-weight="820" fill="#0b2528">25%</text>
    </g>

    <rect x="1048" y="530" width="440" height="190" rx="30" fill="url(#darkPanel)" filter="url(#soft)"/>
    <text x="1082" y="584" class="h2Light">流水洞察</text>
    <text x="1082" y="618" class="lightSmall">负责解释消费节奏，不承担录入。</text>
    <path d="M1084 678c40-46 76 18 120-20s82-68 140-26 78 12 112-12" fill="none" stroke="#2bd8c2" stroke-width="8" stroke-linecap="round"/>
    <text x="1082" y="690" class="lightSmall">晚餐与日用品是本周主要波动来源。</text>

    <rect x="1048" y="748" width="440" height="190" rx="30" fill="url(#panel)" stroke="#dce9e5" filter="url(#soft)"/>
    <text x="1082" y="802" class="h2">分类管理</text>
    <text x="1082" y="836" class="small">只负责维护分类、预算规则和停用状态。</text>
    <g transform="translate(1082 872)">
      <rect x="0" y="0" width="92" height="40" rx="20" fill="#e4f8f3"/>
      <text x="46" y="26" text-anchor="middle" font-size="15" font-weight="820" fill="#07847b">餐饮</text>
      <rect x="104" y="0" width="92" height="40" rx="20" fill="#e8eefc"/>
      <text x="150" y="26" text-anchor="middle" font-size="15" font-weight="820" fill="#2f67df">交通</text>
      <rect x="208" y="0" width="92" height="40" rx="20" fill="#fff1d3"/>
      <text x="254" y="26" text-anchor="middle" font-size="15" font-weight="820" fill="#b7791f">购物</text>
    </g>

    <rect x="112" y="966" width="1376" height="64" rx="30" fill="#082326"/>
    <text x="148" y="1006" font-size="18" font-weight="780" fill="#e9fffb">v2 信息架构：总览看结论，预算看明细，洞察看原因，快速记账只出现一次。</text>
    <text x="1448" y="1006" text-anchor="end" font-size="18" font-weight="850" fill="#2bd8c2">减少重复功能</text>
  </g>
</svg>
