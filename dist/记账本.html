<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日记账</title>
    <style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light;
  --bg: #f7faf9;
  --surface: #ffffff;
  --surface-raised: #fbfdfc;
  --surface-muted: #f1f5f4;
  --text: #0b1f23;
  --muted: #607174;
  --muted-2: #889698;
  --border: #dbe6e4;
  --border-strong: #b9c9c7;
  --accent: #0b938b;
  --accent-strong: #08756f;
  --accent-soft: #e4f6f3;
  --blue: #2f67df;
  --blue-soft: #e8eefc;
  --teal: #0b938b;
  --teal-soft: #e4f6f3;
  --amber: #b7791f;
  --amber-soft: #fff6df;
  --red: #c43b46;
  --red-soft: #fdecef;
  --violet: #6747c7;
  --violet-soft: #eeeafe;
  --shadow: 0 16px 34px rgba(18, 42, 45, 0.08);
  --shadow-soft: 0 8px 18px rgba(18, 42, 45, 0.06);
  --ring: 0 0 0 3px rgba(11, 147, 139, 0.16);
  --radius: 8px;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 82% -8%, rgba(11, 147, 139, 0.11), transparent 320px),
    radial-gradient(circle at 10% 100%, rgba(47, 103, 223, 0.08), transparent 360px),
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 340px),
    var(--bg);
  color: var(--text);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  padding: 0 14px;
  cursor: pointer;
  font-weight: 650;
  transition: border-color 150ms ease, background 150ms ease, color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

button:hover {
  border-color: var(--border-strong);
  background: var(--surface-raised);
}

button:focus-visible,
input:focus,
select:focus,
textarea:focus {
  outline: 0;
  border-color: var(--accent);
  box-shadow: var(--ring);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

input,
select,
textarea {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  padding: 10px 12px;
  font-size: 15px;
  transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
}

select {
  appearance: auto;
}

textarea {
  resize: vertical;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  font-size: 32px;
  line-height: 1.12;
  font-weight: 800;
}

h2 {
  font-size: 17px;
  line-height: 1.25;
  font-weight: 760;
}

h3 {
  font-size: 14px;
  font-weight: 740;
}

.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 24px 16px 18px;
  border-right: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(18px);
  display: flex;
  flex-direction: column;
  gap: 26px;
}

.brand {
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #19b8aa, #08756f);
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  box-shadow: 0 12px 22px rgba(11, 147, 139, 0.24);
}

.brand strong {
  display: block;
  font-size: 15px;
  line-height: 1.2;
  font-weight: 800;
}

.brand span,
.sidebar-footer span,
.panel-head span,
.metric em,
.expense-item span,
.rule-item span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  font-style: normal;
}

.nav-list {
  display: grid;
  gap: 6px;
}

.nav-btn {
  min-height: 42px;
  width: 100%;
  justify-content: flex-start;
  display: flex;
  align-items: center;
  gap: 10px;
  border-color: transparent;
  background: transparent;
  color: #2f3e42;
  font-size: 14px;
  text-align: left;
}

.nav-btn em {
  font-style: normal;
  line-height: 1.2;
}

.nav-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex: 0 0 26px;
  background: var(--surface-muted);
  color: var(--muted);
  position: relative;
}

.nav-icon::before,
.nav-icon::after {
  content: "";
  display: block;
  position: absolute;
}

.icon-overview::before {
  width: 11px;
  height: 8px;
  border: 2px solid currentColor;
  border-top: 0;
  border-radius: 2px;
  bottom: 6px;
}

.icon-overview::after {
  width: 9px;
  height: 9px;
  border-left: 2px solid currentColor;
  border-top: 2px solid currentColor;
  transform: rotate(45deg);
  top: 5px;
}

.icon-add::before,
.icon-add::after {
  width: 12px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
}

.icon-add::after {
  transform: rotate(90deg);
}

.icon-categories::before {
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-radius: 3px;
}

.icon-details::before {
  width: 13px;
  height: 10px;
  border-top: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
}

.icon-details::after {
  width: 13px;
  height: 2px;
  background: currentColor;
}

.icon-import::before {
  width: 12px;
  height: 12px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(-45deg);
  top: 5px;
}

.icon-import::after {
  width: 2px;
  height: 12px;
  background: currentColor;
  top: 6px;
}

.nav-btn:hover {
  background: #f4f8f7;
  color: var(--text);
}

.nav-btn.active {
  border-color: #b7ded8;
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(11, 147, 139, 0.06);
}

.nav-btn.active .nav-icon {
  background: var(--accent);
  color: #fff;
}

.sidebar-footer {
  margin-top: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  background: linear-gradient(180deg, #ffffff, #f4f8f7);
  box-shadow: var(--shadow-soft);
}

.sidebar-footer strong {
  display: block;
  margin-top: 4px;
  font-size: 14px;
}

.content {
  min-width: 0;
  padding: 28px;
}

.view-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 22px;
  align-items: start;
}

.main-column,
.right-column {
  display: grid;
  gap: 22px;
  align-content: start;
}

.page-head,
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.page-head {
  min-height: 54px;
}

.page-head p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 7px;
}

.segmented {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 4px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: var(--shadow-soft);
}

.segmented button {
  min-height: 32px;
  border: 0;
  border-radius: 8px;
  padding: 0 13px;
  font-size: 13px;
  background: transparent;
  color: var(--muted);
}

.segmented button.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 16px rgba(11, 147, 139, 0.23);
}

.metric-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.metric,
.panel {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: var(--shadow);
}

.metric {
  min-height: 118px;
  padding: 20px 18px;
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: space-between;
  gap: 14px;
}

.metric::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--blue);
  opacity: 0.9;
}

.metric-remaining::before {
  background: var(--accent);
}

.metric-budgeted::before {
  background: var(--violet);
}

.metric span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.metric strong {
  display: block;
  margin: 9px 0 5px;
  font-size: 27px;
  line-height: 1;
  font-weight: 800;
}

.metric-icon {
  width: 46px;
  height: 46px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  flex: 0 0 46px;
  background: var(--blue-soft);
  color: var(--blue);
  font-style: normal;
  line-height: 1;
  position: relative;
}

.metric-remaining .metric-icon {
  background: var(--teal-soft);
  color: var(--accent);
}

.metric-budgeted .metric-icon {
  background: var(--violet-soft);
  color: var(--violet);
}

.metric-icon::before,
.metric-icon::after {
  content: none;
}

.metric-glyph,
.category-glyph {
  width: 21px;
  height: 21px;
  display: block;
  position: relative;
  color: currentColor;
}

.metric-glyph::before,
.metric-glyph::after,
.category-glyph::before,
.category-glyph::after {
  content: "";
  position: absolute;
  box-sizing: border-box;
}

.metric-glyph-spent::before {
  left: 4px;
  top: 3px;
  width: 13px;
  height: 15px;
  border: 2px solid currentColor;
  border-radius: 3px;
}

.metric-glyph-spent::after {
  left: 8px;
  top: 7px;
  width: 5px;
  height: 8px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(-45deg);
}

.metric-glyph-remaining::before {
  left: 2px;
  top: 6px;
  width: 17px;
  height: 11px;
  border: 2px solid currentColor;
  border-radius: 4px;
}

.metric-glyph-remaining::after {
  right: 5px;
  top: 10px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
}

.metric-glyph-budgeted::before {
  left: 4px;
  bottom: 4px;
  width: 3px;
  height: 8px;
  background: currentColor;
  box-shadow: 6px -4px 0 currentColor, 12px -8px 0 currentColor;
}

.metric-glyph-budgeted::after {
  left: 2px;
  bottom: 3px;
  width: 17px;
  height: 2px;
  background: currentColor;
}

.metric-spent .metric-icon::before {
  width: 18px;
  height: 12px;
  border-left: 3px solid currentColor;
  border-bottom: 3px solid currentColor;
  transform: rotate(-45deg);
}

.metric-remaining .metric-icon::before {
  width: 18px;
  height: 14px;
  border: 3px solid currentColor;
  border-radius: 4px;
}

.metric-remaining .metric-icon::after {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  right: 13px;
}

.metric-budgeted .metric-icon::before {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: conic-gradient(currentColor 0 74%, transparent 74% 100%);
}

.panel {
  padding: 18px;
}

.budget-list,
.recent-list,
.signal-list,
.rule-list,
.tool-list {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}

.budget-header {
  display: grid;
  grid-template-columns: minmax(132px, 1.25fr) minmax(88px, 0.7fr) minmax(88px, 0.7fr) minmax(96px, 0.8fr) minmax(120px, 1fr) 48px;
  gap: 12px;
  margin-top: 18px;
  padding: 0 12px 10px;
  color: var(--muted);
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 650;
}

.budget-row {
  width: 100%;
  min-height: 70px;
  display: grid;
  grid-template-columns: minmax(132px, 1.25fr) minmax(88px, 0.7fr) minmax(88px, 0.7fr) minmax(96px, 0.8fr) minmax(120px, 1fr) 48px;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: #fbfdfd;
  border-color: var(--border);
  border-radius: 12px;
  box-shadow: none;
}

.budget-row:hover {
  border-color: var(--border-strong);
  background: #ffffff;
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}

.budget-row strong,
.budget-row span {
  display: block;
}

.budget-row .category-orb,
.expense-item .category-orb {
  display: inline-grid;
}

.budget-main strong {
  font-size: 15px;
  font-weight: 760;
}

.budget-main {
  display: flex;
  align-items: center;
  gap: 10px;
}

.budget-main em,
.budget-cell span {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  font-style: normal;
}

.budget-cell b {
  font-size: 13px;
  font-weight: 720;
}

.budget-cell.positive b {
  color: var(--teal);
}

.budget-cell.negative b {
  color: var(--red);
}

.progress-cell {
  min-width: 0;
}

.budget-percent {
  text-align: right;
  font-size: 13px;
  font-weight: 760;
}

.budget-row.near {
  background: var(--amber-soft);
  border-color: #efd197;
}

.budget-row.over {
  background: var(--red-soft);
  border-color: #edb2ba;
}

.progress {
  height: 9px;
  border-radius: 999px;
  overflow: hidden;
  background: #e6eeee;
}

.progress i {
  display: block;
  height: 100%;
  min-width: 6px;
  border-radius: inherit;
  background: linear-gradient(90deg, #10b8a9, var(--teal));
}

.budget-row.near .progress i {
  background: linear-gradient(90deg, #f2a51d, var(--amber));
}

.budget-row.over .progress i {
  background: linear-gradient(90deg, #ef5060, var(--red));
}

.expense-item,
.rule-item,
.signal {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 58px;
  padding: 12px 13px;
  background: #fff;
  transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.expense-item:hover,
.rule-item:hover,
.signal:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-soft);
}

.expense-item {
  justify-content: flex-start;
}

.expense-item div:first-of-type {
  flex: 1;
}

.expense-item div:last-child {
  text-align: right;
  margin-left: auto;
}

.expense-item strong,
.rule-item strong,
.signal strong {
  font-size: 14px;
  font-weight: 740;
}

.signal {
  background: #f7fbfa;
}

.signal-ok {
  justify-content: flex-start;
}

.signal-ok div {
  display: grid;
  gap: 3px;
}

.signal-ok strong {
  display: block;
}

.signal-check {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  flex: 0 0 28px;
  position: relative;
}

.signal-check::before {
  content: "";
  position: absolute;
  width: 10px;
  height: 6px;
  border-left: 2px solid var(--accent);
  border-bottom: 2px solid var(--accent);
  transform: rotate(-45deg);
  left: 7px;
  top: 8px;
}

.signal.near {
  background: var(--amber-soft);
  border-color: #efd197;
}

.signal.over {
  background: var(--red-soft);
  border-color: #edb2ba;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 16px;
}

label span {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.wide {
  grid-column: 1 / -1;
}

.compact-panel .default-date-field {
  grid-column: 1 / -1;
}

.primary-btn {
  min-height: 46px;
  background: linear-gradient(180deg, #12aaa0, var(--accent));
  border-color: var(--accent);
  color: #fff;
  font-weight: 780;
  box-shadow: 0 10px 20px rgba(11, 147, 139, 0.22);
}

.primary-btn:hover {
  background: linear-gradient(180deg, #0d958c, var(--accent-strong));
  border-color: var(--accent-strong);
  transform: translateY(-1px);
}

.danger-btn {
  color: var(--red);
  border-color: #efc2c8;
  background: #fff8f9;
}

.text-btn {
  border: 0;
  min-height: 28px;
  background: transparent;
  color: var(--accent);
  padding: 0;
  font-weight: 720;
}

.text-btn:hover {
  background: transparent;
  color: var(--accent-strong);
}

.notice {
  margin-bottom: 14px;
  border: 1px solid #b7ded8;
  background: var(--teal-soft);
  color: #0b625d;
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 13px;
  font-weight: 650;
}

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 18px;
  border: 1px dashed var(--border);
  border-radius: 12px;
  background: #f7faf9;
  text-align: center;
}

.split-view {
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
  gap: 22px;
}

.category-tree {
  display: grid;
  gap: 9px;
  margin-top: 16px;
}

.branch {
  display: grid;
  gap: 6px;
}

.children {
  display: grid;
  gap: 6px;
  padding-left: 25px;
}

.category-node {
  min-height: 42px;
  justify-content: flex-start;
  text-align: left;
  border-color: transparent;
  background: var(--surface-muted);
  display: flex;
  align-items: center;
  gap: 9px;
  border-radius: 11px;
}

.category-node:hover {
  background: #e9f0ef;
}

.category-node.parent {
  font-weight: 740;
}

.category-node.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-strong);
  box-shadow: inset 0 0 0 1px rgba(11, 147, 139, 0.08);
}

.category-orb {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 38px;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  font-weight: 760;
  line-height: 1;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.78), 0 6px 12px rgba(20, 32, 42, 0.08);
}

.glyph-text {
  display: grid;
  place-items: center;
}

.glyph-food::before {
  left: 4px;
  top: 10px;
  width: 13px;
  height: 7px;
  border: 2px solid currentColor;
  border-top: 0;
  border-radius: 0 0 9px 9px;
}

.glyph-food::after {
  left: 6px;
  top: 5px;
  width: 12px;
  height: 2px;
  background: currentColor;
  transform: rotate(-24deg);
  transform-origin: left center;
}

.glyph-takeout::before {
  left: 4px;
  top: 6px;
  width: 13px;
  height: 12px;
  border: 2px solid currentColor;
  border-radius: 3px;
}

.glyph-takeout::after {
  left: 6px;
  top: 4px;
  width: 9px;
  height: 5px;
  border: 2px solid currentColor;
  border-bottom: 0;
  border-radius: 3px 3px 0 0;
}

.glyph-basket::before,
.glyph-bag::before {
  left: 4px;
  top: 8px;
  width: 14px;
  height: 10px;
  border: 2px solid currentColor;
  border-radius: 3px;
}

.glyph-basket::after,
.glyph-bag::after {
  left: 7px;
  top: 4px;
  width: 8px;
  height: 7px;
  border: 2px solid currentColor;
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
}

.glyph-route::before {
  left: 4px;
  top: 5px;
  width: 13px;
  height: 12px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  border-radius: 0 0 0 7px;
}

.glyph-route::after {
  left: 3px;
  top: 4px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 11px 11px 0 currentColor;
}

.glyph-bus::before,
.glyph-car::before {
  left: 3px;
  top: 7px;
  width: 15px;
  height: 9px;
  border: 2px solid currentColor;
  border-radius: 4px;

function getPeriodRange(period, today = isoToday()) {
  const date = parseIsoDate(today);
  if (period === "weekly") return weeklyRange(date);
  if (period === "monthly") return monthlyRange(date);
  if (period === "yearly") return yearlyRange(date);
  throw new Error(`Unsupported period: ${period}`);
}
function isDateInPeriod(date, period, today = isoToday()) {

}
function isoToday(now = new Date()) {

}

function weeklyRange(date) {
  const day = date.getUTCDay();
  const offsetFromMonday = (day + 6) % 7;
  const start = addDays(date, -offsetFromMonday);
  const end = addDays(start, 6);
  return { start: formatDate(start), end: formatDate(end) };
}

function monthlyRange(date) {
  const start = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1));
  const end = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0));
  return { start: formatDate(start), end: formatDate(end) };
}

function yearlyRange(date) {
  const year = date.getUTCFullYear();
  return { start: `${year}-01-01`, end: `${year}-12-31` };
}

function parseIsoDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
    throw new Error(`Invalid ISO date: ${value}`);
  }
  const date = new Date(`${value}T00:00:00.000Z`);
  if (Number.isNaN(date.getTime())) {
    throw new Error(`Invalid ISO date: ${value}`);
  }
  return date;
}

function addDays(date, days) {
  const copy = new Date(date);
  copy.setUTCDate(copy.getUTCDate() + days);
  return copy;
}

function formatDate(date) {
  return date.toISOString().slice(0, 10);
}


function getBudgetRows({ categories, expenses, budgetRules, period, today }) {

  return activeRules.map((rule) => {
    const category = categories.find((item) => item.id === rule.categoryId);
    const spent = sumForCategory({ categories, expenses, categoryId: rule.categoryId, period, today });
    const ratio = rule.amount > 0 ? spent / rule.amount : 0;
    return {
      ruleId: rule.id,
      categoryId: rule.categoryId,
      categoryName: categoryLabel(categories, category),
      period,
      amount: rule.amount,

    }
  }
  for (const rule of data.budgetRules) {
    if (!rule.id || !rule.categoryId || !isPeriod(rule.period) || !(Number(rule.amount) > 0) || typeof rule.active !== "boolean") {
      return "预算规则记录无效";
    }
  }
  return null;
}

function mergeData(current, incoming) {
  return {
    ...current,
    version: DATA_VERSION,
    expenses: mergeById(current.expenses, incoming.expenses),
    categories: mergeById(current.categories, incoming.categories),
    budgetRules: mergeById(current.budgetRules, incoming.budgetRules),
    preferences: { ...current.preferences, ...incoming.preferences }
  };
}

function mergeById(left, right) {
  const map = new Map(left.map((item) => [item.id, item]));
  for (const item of right) map.set(item.id, item);
  return Array.from(map.values());
}

function validDate(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(new Date(`${value}T00:00:00.000Z`).getTime());
}

function csvCell(value) {
  const text = String(value ?? "");
  if (/[",\n]/.test(text)) return `"${text.replaceAll("\"", "\"\"")}"`;
  return text;
}

const DATA_KEY = "budget-ledger:data";
const BACKUP_KEY = "budget-ledger:last-backup";
const legacyCategoryNames = new Map([
  ["food", ["Food", "餐饮"]],
  ["takeout", ["Takeout", "外卖"]],
  ["groceries", ["Groceries", "菜场超市"]],
  ["transport", ["Transport", "交通"]],
  ["subway", ["Subway", "地铁公交"]],
  ["taxi", ["Taxi", "打车"]],
  ["shopping", ["Shopping", "购物"]],
  ["daily-goods", ["Daily Goods", "日用品"]],
  ["housing", ["Housing", "居住"]],
  ["rent", ["Rent", "房租"]],
  ["entertainment", ["Entertainment", "娱乐"]],
  ["movies", ["Movies", "电影演出"]],
  ["health", ["Health", "健康"]],
  ["medicine", ["Medicine", "药品医疗"]],
  ["learning", ["Learning", "学习"]],
  ["books", ["Books", "书籍课程"]]
]);
function loadData(storage = globalThis.localStorage) {
  if (!storage) return createInitialData();
  const raw = storage.getItem(DATA_KEY);
  if (!raw) return createInitialData();
  const parsed = parseBackupJson(raw);
  if (!parsed.ok) return { ...createInitialData(), recovery: { corruptData: raw } };
  const migrated = migrateLegacyChineseLabels(parsed.data);
  if (migrated.changed) saveData(migrated.data, storage);
  return migrated.data;
}
function saveData(data, storage = globalThis.localStorage) {
  storage?.setItem(DATA_KEY, JSON.stringify(data));
}
function saveBackup(data, storage = globalThis.localStorage) {
  storage?.setItem(BACKUP_KEY, JSON.stringify(data));
}
function loadBackup(storage = globalThis.localStorage) {
  const raw = storage?.getItem(BACKUP_KEY);
  if (!raw) return null;
  const parsed = parseBackupJson(raw);
  return parsed.ok ? parsed.data : null;
}
function applyImport(currentData, json, mode, storage = globalThis.localStorage) {
  const result = importJsonBackup(currentData, json, mode);
  if (result.ok) {
    const migrated = migrateLegacyChineseLabels(result.data);
    saveBackup(result.backup, storage);
    saveData(migrated.data, storage);
    return { ...result, data: migrated.data };
  }
  return result;
}

function migrateLegacyChineseLabels(data) {
  let changed = false;
  const categories = data.categories.map((category) => {
    const legacy = legacyCategoryNames.get(category.id);
    if (!legacy || category.name !== legacy[0]) return category;
    changed = true;
    return { ...category, name: legacy[1] };
  });
  return { changed, data: changed ? { ...data, categories } : data };
}

        date: input.date,
        categoryId: input.categoryId,
        subcategoryId: input.subcategoryId,
        note: input.note
      });
      state.editingExpenseId = null;
      persist("支出已更新");
    } catch (error) {
      notify(error.message);
    }
  });
}

function bindImportExportEvents() {
  document.querySelector("[data-export-json]")?.addEventListener("click", () => download("记账备份.json", exportJson(state.data), "application/json"));
  document.querySelector("[data-export-csv]")?.addEventListener("click", () => download("支出流水.csv", exportCsv(state.data), "text/csv"));
  document.querySelectorAll("[data-import-mode]").forEach((button) => {
    button.addEventListener("click", () => {
      state.importMode = button.dataset.importMode;
      render();
    });
  });
  document.getElementById("backup-file")?.addEventListener("change", async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    state.importText = await file.text();
    render();
  });
  document.getElementById("import-form")?.addEventListener("submit", (event) => {
    event.preventDefault();
    const input = formData(event.currentTarget);
    const result = applyImport(state.data, input.backup, state.importMode);
    if (result.ok) {
      state.data = result.data;
      state.importText = "";
      persist(`备份已${state.importMode === "merge" ? "合并" : "覆盖"}导入`);
    } else {
      notify(result.error);
    }
  });
}

function navButton(id, label, compact = false) {
  return `
    <button class="nav-btn ${state.view === id ? "active" : ""}" data-view="${id}">
      <span class="nav-icon icon-${id}" aria-hidden="true"></span>
      <em>${compact ? shortLabel(label) : label}</em>
    </button>
  `;
}

function budgetRow(row) {
  const pct = Math.min(100, Math.round(row.ratio * 100));
  const tone = getCategoryTone(row.categoryId, row.categoryName);
  return `
    <button class="budget-row ${row.state}" data-filter-category="${row.categoryId}">
      <div class="budget-main">
        <span class="category-orb ${tone}" aria-hidden="true">${categoryIcon(row.categoryId, row.categoryName)}</span>
        <span>
          <strong>${escapeHtml(row.categoryName)}</strong>
          <em>${labelPeriod(row.period)}规则</em>
        </span>
      </div>
      <div class="budget-cell">
        <span>已支出</span>
        <b>${money(row.spent)}</b>
      </div>
      <div class="budget-cell">
        <span>预算</span>
        <b>${money(row.amount)}</b>
      </div>
      <div class="budget-cell ${row.remaining < 0 ? "negative" : "positive"}">
        <span>剩余</span>
        <b>${money(row.remaining)}</b>
      </div>
      <div class="progress-cell">
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>
      <strong class="budget-percent">${pct}%</strong>
    </button>
  `;
}

function metricCard(kind, label, value, caption) {
  return `
    <div class="metric metric-${kind}">
      <div>
        <span>${label}</span>
        <strong>${value}</strong>
        <em>${caption}</em>
      </div>
      <i class="metric-icon" aria-hidden="true">${metricIcon(kind)}</i>
    </div>
  `;
}

function metricIcon(kind) {
  return `<span class="metric-glyph metric-glyph-${escapeAttr(kind)}"></span>`;
}

function expenseItem(expense) {
  const label = categoryPath(expense);
  const iconCategoryId = expense.subcategoryId || expense.categoryId;
  const tone = getCategoryTone(iconCategoryId, label);
  return `
    <div class="expense-item">
      <span class="category-orb ${tone}" aria-hidden="true">${categoryIcon(iconCategoryId, label)}</span>
      <div><strong>${escapeHtml(label)}</strong><span>${escapeHtml(expense.note || "无备注")}</span></div>
      <div><b>${money(expense.amount)}</b><span>${expense.date}</span></div>
    </div>
  `;
}

function expenseRow(expense) {
  return `
    <tr>
      <td>${expense.date}</td>
      <td>${money(expense.amount)}</td>
      <td>${escapeHtml(categoryPath(expense))}</td>
      <td>${escapeHtml(expense.note || "")}</td>
      <td class="actions">
        <button data-edit-expense="${expense.id}">编辑</button>
        <button class="danger-btn" data-delete-expense="${expense.id}">删除</button>
      </td>
    </tr>
  `;
}

function editExpenseForm(expense) {
  const parents = parentCategories();
  const children = childCategories(expense.categoryId);
  return `
    <form id="edit-expense-form" class="edit-form">
      <input name="amount" type="number" min="0.01" step="0.01" value="${expense.amount}" required>
      <input name="date" type="date" value="${expense.date}" required>
      <select name="categoryId" data-child-target="edit-child-select">
        ${parents.map((category) => option(category.id, category.name, category.id === expense.categoryId)).join("")}
      </select>
      <select id="edit-child-select" name="subcategoryId">
        ${children.map((category) => option(category.id, category.name, category.id === expense.subcategoryId)).join("")}
      </select>
      <input name="note" value="${escapeAttr(expense.note)}">
      <button class="primary-btn" type="submit">更新</button>
    </form>
  `;
}

function categoryBranch(parent) {
  const isExpanded = state.expandedParentId === parent.id;
  const children = childCategories(parent.id);
  return `
    <div class="branch">
      <button class="category-node parent ${selectedClass(parent.id)} ${parent.active ? "" : "muted"}" data-select-category="${parent.id}" aria-expanded="${isExpanded}">
        <span class="tree-toggle">${isExpanded ? "-" : "+"}</span>
        ${escapeHtml(parent.name)}
      </button>
      ${isExpanded ? `<div class="children">${children.map((child) => `
        <button class="category-node ${selectedClass(child.id)} ${child.active ? "" : "muted"}" data-select-category="${child.id}">
          ${escapeHtml(child.name)}
        </button>
      `).join("")}</div>` : ""}
    </div>
  `;
}

function ruleItem(rule) {
  return `
    <div class="rule-item">
      <div><strong>${labelPeriod(rule.period)}</strong><span>${rule.active ? "启用中" : "已暂停"}</span></div>
      <b>${money(rule.amount)}</b>
      <button class="danger-btn" data-delete-rule="${rule.id}">删除</button>
    </div>
  `;
}

function signalList(rows) {
  const signals = rows.filter((row) => row.state !== "normal");
  if (!signals.length) {
    return `
      <div class="signal signal-ok">
        <span class="signal-check" aria-hidden="true"></span>
        <div>
          <strong>预算状态良好</strong>
          <span>暂无接近或超出预算的分类。</span>
        </div>
      </div>
    `;
  }
  return `<div class="signal-list">${signals.map((row) => `
    <div class="signal ${row.state}">
      <strong>${escapeHtml(row.categoryName)}</strong>
      <span>${row.state === "over" ? `超出 ${money(Math.abs(row.remaining))}` : `已用 ${Math.round(row.ratio * 100)}%`}</span>
    </div>
  `).join("")}</div>`;
}

function filteredExpenses() {
  const keyword = state.detailsKeyword.trim().toLowerCase();
  return state.data.expenses.filter((expense) => {
    if (state.detailsPeriod !== "all" && !isDateInPeriod(expense.date, state.detailsPeriod, localIsoDate())) return false;
    if (state.detailsParent !== "all" && expense.categoryId !== state.detailsParent) return false;
    if (state.detailsChild !== "all" && expense.subcategoryId !== state.detailsChild) return false;
    if (!keyword) return true;
    return `${expense.note} ${categoryPath(expense)}`.toLowerCase().includes(keyword);
  });
}

function updateChildSelect(parentSelect) {
  const target = document.getElementById(parentSelect.dataset.childTarget);
  if (!target) return;
  target.innerHTML = childCategories(parentSelect.value)
    .filter((category) => category.active)
    .map((category) => option(category.id, category.name, false))
    .join("");
}

function parentCategories() {
  return state.data.categories.filter((category) => !category.parentId);
}

function childCategories(parentId) {
  return state.data.categories.filter((category) => parentId ? category.parentId === parentId : category.parentId);
}

function categoryPath(expense) {
  const parent = state.data.categories.find((category) => category.id === expense.categoryId);
  const child = state.data.categories.find((category) => category.id === expense.subcategoryId);
  return `${parent?.name || "未知"} / ${child?.name || "未知"}`;
}

function categoryIcon(categoryId, label) {
  const glyph = getCategoryGlyph(categoryId);
  const text = glyph === "glyph-text" ? escapeHtml(getCategoryFallbackText(label)) : "";
  return `<span class="category-glyph ${escapeAttr(glyph)}">${text}</span>`;
}

function persist(message) {
  saveData(state.data);
  notify(message);
}

function notify(message) {
  state.notice = message;
  render();
}

function formData(form) {
  const data = new FormData(form);
  return Object.fromEntries(data.entries());
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
}

function money(value) {
  return new Intl.NumberFormat("zh-CN", { style: "currency", currency: state.data.preferences.currency || "CNY" }).format(value);
}

function rangeLabel(period, today) {
  const range = getPeriodRange(period, today);
  return `${labelPeriod(period)}：${range.start} 至 ${range.end}`;
}

function labelPeriod(period) {
  return ({ weekly: "每周", monthly: "每月", yearly: "每年", all: "全部时间" })[period] || period;
}

function localIsoDate() {
  const now = new Date();
  const offset = now.getTimezoneOffset();
  return new Date(now.getTime() - offset * 60_000).toISOString().slice(0, 10);
}

function emptyState(text) {
  return `<div class="empty">${escapeHtml(text)}</div>`;
}

function option(value, label, selected) {
  return `<option value="${escapeAttr(value)}" ${selected ? "selected" : ""}>${escapeHtml(label)}</option>`;
}

function selectedClass(id) {
  return (state.selectedCategoryId || parentCategories()[0]?.id) === id ? "selected" : "";
}

function shortLabel(label) {
  return label.replace("分类与预算", "预算").replace("导入导出", "导入");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value);
}

</script>
  </body>
</html>
